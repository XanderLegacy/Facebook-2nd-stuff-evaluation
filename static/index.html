<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Post Evaluator</title>
    <style>
        :root {
            --surface-0: #05070C;
            --surface-1: #0A0D12;
            --surface-2: #0F131C;
            --surface-3: #161D2B;
            --surface-4: #1E2636;
            --accent: #38BDF8;
            --accent-dim: #1E3A52;
            --text-primary: #E5E7EB;
            --text-secondary: #9CA3AF;
            --success: #6EE7B7;
            --warning: #FBBF24;
            --danger: #F87171;
            
            --font-display: system-ui, -apple-system, sans-serif;
            --font-body: system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            font-size: clamp(0.875rem, 0.8rem + 0.3vw, 1rem);
            line-height: 1.6;
            background: var(--surface-0);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: clamp(1rem, 2vw, 2rem);
        }

        header {
            text-align: center;
            padding: clamp(2rem, 4vw, 4rem) 0 clamp(1.5rem, 3vw, 3rem);
        }

        h1 {
            font-size: clamp(1.75rem, 3vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: clamp(0.875rem, 1.5vw, 1.125rem);
            color: var(--text-secondary);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background: var(--surface-3);
            border-radius: 16px;
            padding: clamp(1.25rem, 2vw, 2rem);
        }

        .card-title {
            font-size: clamp(1.125rem, 2vw, 1.5rem);
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        textarea, input[type="number"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--surface-1);
            border: 1px solid var(--surface-4);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.9375rem;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea {
            min-height: 120px;
        }

        .file-upload {
            position: relative;
            display: block;
            padding: 2rem;
            background: var(--surface-1);
            border: 2px dashed var(--surface-4);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .file-upload:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .file-upload input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
        }

        .file-upload-text {
            color: var(--text-secondary);
        }

        .file-list {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .file-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--surface-4);
            border-radius: 999px;
            font-size: 0.875rem;
            color: var(--text-primary);
        }

        .file-chip button {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.125rem;
            line-height: 1;
            padding: 0;
        }

        .file-chip button:hover {
            color: var(--danger);
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 2rem;
            background: var(--accent);
            color: var(--surface-0);
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .button:hover:not(:disabled) {
            opacity: 0.9;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .button-full {
            width: 100%;
        }

        .result-card {
            display: none;
        }

        .result-card.visible {
            display: block;
        }

        .score-display {
            text-align: center;
            padding: 2rem;
            background: var(--surface-2);
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .score-value {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .score-label {
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .score-excellent { color: var(--success); }
        .score-good { color: var(--accent); }
        .score-fair { color: var(--warning); }
        .score-poor { color: var(--danger); }

        .info-grid {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .info-section {
            padding: 1.25rem;
            background: var(--surface-2);
            border-radius: 12px;
        }

        .info-section h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--surface-3);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-success { background: var(--success); color: var(--surface-0); }
        .badge-warning { background: var(--warning); color: var(--surface-0); }
        .badge-danger { background: var(--danger); color: var(--surface-0); }
        .badge-info { background: var(--accent); color: var(--surface-0); }

        .list {
            list-style: none;
            padding: 0;
        }

        .list-item {
            padding: 0.5rem 0;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .list-item::before {
            content: "•";
            color: var(--accent);
            font-weight: 700;
        }

        .explanation {
            padding: 1.5rem;
            background: var(--surface-2);
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            line-height: 1.7;
        }

        .warning-box {
            padding: 1rem 1.25rem;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid var(--warning);
            border-radius: 8px;
            color: var(--warning);
            margin-bottom: 1.5rem;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--surface-3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            display: none;
            padding: 1rem 1.25rem;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid var(--danger);
            border-radius: 8px;
            color: var(--danger);
            margin-bottom: 1.5rem;
        }

        .error.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Facebook Post Evaluator</h1>
            <p class="subtitle">Evaluate second-hand sale posts and get a pricing quality score</p>
        </header>

        <div class="grid">
            <!-- Input Form -->
            <div class="card">
                <h2 class="card-title">Post Details</h2>
                
                <div id="error" class="error"></div>

                <form id="evaluationForm">
                    <div class="form-group">
                        <label for="caption">Caption Text</label>
                        <textarea 
                            id="caption" 
                            name="caption" 
                            placeholder="Paste the post caption here... (Vietnamese or English)"
                            required
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="images">Images (1-8 photos)</label>
                        <label class="file-upload" for="images">
                            <input 
                                type="file" 
                                id="images" 
                                name="images" 
                                accept="image/*" 
                                multiple 
                                required
                            >
                            <div class="file-upload-text">
                                Click or drag images here<br>
                                <small>Maximum 8 images</small>
                            </div>
                        </label>
                        <div id="fileList" class="file-list"></div>
                    </div>

                    <div class="form-group">
                        <label for="manualPrice">Manual Price (optional)</label>
                        <input 
                            type="number" 
                            id="manualPrice" 
                            name="manualPrice" 
                            placeholder="Enter price in VND (e.g., 14500000)"
                        >
                    </div>

                    <button type="submit" class="button button-full">Evaluate Post</button>
                </form>
            </div>

            <!-- Result Display -->
            <div>
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>Analyzing post...</p>
                </div>

                <div id="result" class="card result-card">
                    <h2 class="card-title">Evaluation Result</h2>
                    <div id="resultContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('evaluationForm');
        const fileInput = document.getElementById('images');
        const fileList = document.getElementById('fileList');
        const loading = document.getElementById('loading');
        const resultCard = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');
        const errorBox = document.getElementById('error');

        let selectedFiles = [];

        // File selection handling
        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files).slice(0, 8);
            updateFileList();
        });

        function updateFileList() {
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '';
                return;
            }

            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-chip">
                    ${file.name}
                    <button type="button" onclick="removeFile(${index})">×</button>
                </div>
            `).join('');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorBox.classList.remove('visible');
            resultCard.classList.remove('visible');
            loading.classList.add('visible');

            const formData = new FormData();
            formData.append('caption', document.getElementById('caption').value);
            
            selectedFiles.forEach(file => {
                formData.append('images', file);
            });

            const manualPrice = document.getElementById('manualPrice').value;
            if (manualPrice) {
                formData.append('manual_price', manualPrice);
            }

            try {
                const response = await fetch('/evaluate', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Evaluation failed');
                }

                const result = await response.json();
                displayResult(result);

            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.classList.add('visible');
            } finally {
                loading.classList.remove('visible');
            }
        });

        function displayResult(result) {
            const scoreClass = 
                result.score >= 8 ? 'score-excellent' :
                result.score >= 7 ? 'score-good' :
                result.score >= 5 ? 'score-fair' : 'score-poor';

            const scoreLabel = 
                result.score >= 8 ? 'Excellent Deal' :
                result.score >= 7 ? 'Good Deal' :
                result.score >= 5 ? 'Fair Price' :
                result.score >= 3 ? 'Overpriced' : 'Poor Deal';

            let html = `
                <div class="score-display">
                    <div class="score-value ${scoreClass}">${result.score.toFixed(1)}/10</div>
                    <div class="score-label ${scoreClass}">${scoreLabel}</div>
                </div>
            `;

            if (result.insufficient_data) {
                html += `
                    <div class="warning-box">
                        ⚠ Insufficient data - Score may be unreliable
                    </div>
                `;
            }

            if (result.warnings && result.warnings.length > 0) {
                html += `<div class="warning-box">`;
                result.warnings.forEach(warning => {
                    html += `⚠ ${warning}<br>`;
                });
                html += `</div>`;
            }

            html += `<div class="info-grid">`;

            // Price information
            if (result.fair_price_range) {
                const fp = result.fair_price_range;
                html += `
                    <div class="info-section">
                        <h3>Price Analysis</h3>
                        <div class="info-row">
                            <span class="info-label">Asking Price</span>
                            <span class="info-value">${formatPrice(result.asking_price)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Fair Price (Low)</span>
                            <span class="info-value">${formatPrice(fp.low)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Fair Price (Mid)</span>
                            <span class="info-value">${formatPrice(fp.mid)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Fair Price (High)</span>
                            <span class="info-value">${formatPrice(fp.high)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Price Source</span>
                            <span class="info-value">${fp.reference.source}</span>
                        </div>
                        ${fp.reference.comparable_count > 0 ? `
                            <div class="info-row">
                                <span class="info-label">Comparables</span>
                                <span class="info-value">${fp.reference.comparable_count}</span>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            // Condition
            html += `
                <div class="info-section">
                    <h3>Condition</h3>
                    <div class="info-row">
                        <span class="info-label">Condition Score</span>
                        <span class="info-value">${result.condition.condition_score}/10</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Photos</span>
                        <span class="info-value">${result.condition.photo_count}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Real Photos</span>
                        <span class="info-value">${result.condition.looks_like_real_photos ? 'Yes' : 'No'}</span>
                    </div>
            `;

            if (result.condition.visible_defects && result.condition.visible_defects.length > 0) {
                html += `
                    <div style="margin-top: 1rem;">
                        <div class="info-label" style="margin-bottom: 0.5rem;">Defects:</div>
                        <ul class="list">
                            ${result.condition.visible_defects.map(d => `<li class="list-item">${d}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            html += `</div>`;

            // Caption signals
            if (result.caption_signals.red_flags && result.caption_signals.red_flags.length > 0) {
                html += `
                    <div class="info-section">
                        <h3>Red Flags</h3>
                        <ul class="list">
                            ${result.caption_signals.red_flags.map(f => `<li class="list-item">${f}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            html += `</div>`;

            // Explanation
            html += `
                <div class="explanation">
                    ${result.explanation}
                </div>
            `;

            html += `
                <div style="text-align: center; margin-top: 1.5rem;">
                    <span class="badge badge-info">Confidence: ${result.confidence}</span>
                </div>
            `;

            resultContent.innerHTML = html;
            resultCard.classList.add('visible');
        }

        function formatPrice(price) {
            if (!price) return 'N/A';
            return new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND'
            }).format(price);
        }
    </script>
</body>
</html>

# Scoring configuration for second-hand post evaluation

# Map price ratio (asking_price / fair_price) to base score
# Higher score = better deal for buyer
ratio_to_score:
  - ratio: 0.5
    score: 9.5
    warning: "Suspiciously cheap - possible scam, hidden defects, or stolen item"
  - ratio: 0.6
    score: 9.2
  - ratio: 0.7
    score: 9.0
  - ratio: 0.8
    score: 8.5
  - ratio: 0.85
    score: 8.0
  - ratio: 0.9
    score: 7.5
  - ratio: 1.0
    score: 7.0
  - ratio: 1.1
    score: 6.0
  - ratio: 1.15
    score: 5.0
  - ratio: 1.25
    score: 4.0
  - ratio: 1.35
    score: 3.0
  - ratio: 1.5
    score: 2.0
  - ratio: 2.0
    score: 1.5
  - ratio: 3.0
    score: 1.0

# Condition score (0-10) to fair price multiplier
condition_multipliers:
  10: 1.10  # Mint, sealed, premium
  9: 1.05   # Like new
  8: 1.00   # Good used condition
  7: 0.95   # Normal wear
  6: 0.90   # Visible wear
  5: 0.85   # Moderate damage
  4: 0.80   # Significant wear
  3: 0.70   # Heavy damage
  2: 0.60   # Major defects
  1: 0.50   # Barely functional
  0: 0.40   # Parts only

# Score adjustments (added/subtracted from base score)
adjustments:
  red_flags:
    ib_gia: -0.5              # "DM for price" = shady
    deposit_required: -1.0     # Demands deposit before meeting
    pressure_tactics: -0.5     # "Call now", "first come first serve"
    stock_photos_only: -1.5    # Only stock images, no real photos
    vague_details: -0.3        # Lacking specifics
    no_meetup_mentioned: -0.4  # No public meetup suggestion
    too_good_to_be_true: -1.0  # Unrealistic claims
  
  missing_info:
    no_price: -0.5             # Price not stated
    few_photos: -0.3           # Less than 3 photos
    no_real_photos: -1.5       # No actual item photos
    unclear_product: -0.8      # Can't identify exact model
  
  bonuses:
    has_box: 0.2               # Original packaging
    has_invoice: 0.3           # Proof of purchase
    warranty_remaining: 0.5    # Active warranty
    full_accessories: 0.2      # All original accessories
    detailed_description: 0.2  # Thorough, transparent caption
    multiple_angles: 0.1       # 5+ clear photos

# Confidence determination rules
confidence_rules:
  high:
    min_comparables: 10
    min_photo_count: 4
    requires_real_photos: true
    max_red_flags: 0
  
  medium:
    min_comparables: 3
    min_photo_count: 2
    requires_real_photos: true
    max_red_flags: 1
  
  low:
    # Everything else falls to low confidence
    notes: "Insufficient comparables, few photos, or multiple red flags"

# When to return "insufficient data" instead of a score
insufficient_data_triggers:
  - no_reference_price
  - unclear_product_category
  - no_photos_and_no_price
  - comparables_below_threshold: 2

# Depreciation model (fallback when no comparables)
# Multiplier = retail_price * age_factor
depreciation_curve:
  0_to_6_months: 0.85
  6_to_12_months: 0.75
  12_to_18_months: 0.65
  18_to_24_months: 0.55
  24_to_36_months: 0.45
  36_to_48_months: 0.35
  over_48_months: 0.25